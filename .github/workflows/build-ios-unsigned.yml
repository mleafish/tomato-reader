name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: mleafish/tomato-reader-privacy
          token: ${{ secrets.SOURCE_TOKEN }}
          path: source

      - name: Test bookstore bridge behavior
        working-directory: source
        run: node --test ios/bookstore-bridge.test.cjs

      - name: Test login WebView behavior
        working-directory: source
        run: node --test ios/platform-login.test.cjs

      - name: Test comment pagination behavior
        working-directory: source
        run: node --test ios/comment-pagination.test.cjs

      - name: Test segment comment behavior
        working-directory: source
        run: node --test ios/segment-comment.test.cjs

      - name: Test bookstore tag taxonomy
        working-directory: source
        run: node --test ios/mall-taxonomy.test.cjs

      - name: Test bookstore recommendation ranking
        working-directory: source
        run: |
          xcrun swiftc -O \
            ios/App/App/MallRecommender.swift \
            ios/mall-recommender-test/main.swift \
            -o "$RUNNER_TEMP/mall-recommender-test"
          "$RUNNER_TEMP/mall-recommender-test"

      - name: Build without code signing
        working-directory: source
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            PROVISIONING_PROFILE_SPECIFIER='' \
            SWIFT_COMPILATION_MODE=wholemodule \
            OTHER_SWIFT_FLAGS='$(inherited) -file-prefix-map $PWD=/src' \
            OTHER_CFLAGS='$(inherited) -fdebug-prefix-map=$PWD=/src' \
            clean build

      - name: Package unsigned IPA
        working-directory: source
        run: |
          APP_PATH="$PWD/.build/Build/Products/Release-iphoneos/TomatoReader.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/TomatoReader.app
          rm -rf Payload/TomatoReader.app/_CodeSignature
          strip -S Payload/TomatoReader.app/TomatoReader || true
          if strings -a Payload/TomatoReader.app/TomatoReader | grep -qi "tomato-reader-privacy"; then
            echo "refusing to publish: repository name found in the product"; exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent Payload tomato-reader-unsigned.ipa

      - name: Publish IPA
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          gh release view latest --repo mleafish/tomato-reader-privacy >/dev/null 2>&1 \
            || gh release create latest --repo mleafish/tomato-reader-privacy \
                 --title "Latest build" --notes "Replaced on every build."
          gh release upload latest tomato-reader-unsigned.ipa \
            --repo mleafish/tomato-reader-privacy --clobber

      - name: Publish IPA to Gitee
        working-directory: source
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          API=https://gitee.com/api/v5/repos/mjhyy/tomato-reader-privacy
          release_id=$(curl -fsS "$API/releases?access_token=$GITEE_TOKEN&per_page=1" | jq -r '.[0].id // empty')
          if [ -z "$release_id" ]; then
            release_id=$(curl -fsS -X POST "$API/releases" \
              -d "access_token=$GITEE_TOKEN" -d "tag_name=latest" \
              -d "name=Latest build" -d "body=Replaced on every build." | jq -r '.id')
          fi
          for old in $(curl -fsS "$API/releases/$release_id/attach_files?access_token=$GITEE_TOKEN" | jq -r '.[].id'); do
            curl -fsS -o /dev/null -X DELETE "$API/releases/$release_id/attach_files/$old?access_token=$GITEE_TOKEN"
          done
          curl -fsS -o /dev/null -X POST "$API/releases/$release_id/attach_files" \
            -F "access_token=$GITEE_TOKEN" -F "file=@tomato-reader-unsigned.ipa"
          echo "published to gitee"
